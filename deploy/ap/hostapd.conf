# hostapd — the box's own Wi-Fi.
#
# In AP mode the box is the network: it runs the access point, the DHCP server and
# the DNS server, and nothing here has an uplink. That is the configuration a field
# with no infrastructure needs, and it is also the only configuration where
# intercepting DNS to run a captive portal is honest rather than hijacking.
#
# Substituted by deploy/scripts/install.sh: @IFACE@, @SSID@, @COUNTRY@, @CHANNEL@.

interface=@IFACE@
driver=nl80211

ssid=@SSID@

# 2.4GHz, and deliberately not 5GHz.
#
# 5GHz is faster, less congested, and the wrong choice here. Range matters more than
# throughput — the payload is a few hundred bytes per scan — and 2.4GHz reaches
# further through bodies, tents and marquee canvas. It is also the band every cheap
# Android phone supports without exception, and the scanner fleet at a small event is
# whatever handsets people already own.
hw_mode=g
channel=@CHANNEL@

# Regulatory domain. Not optional: without it the driver picks conservative defaults,
# and on some it refuses to bring the interface up at all.
country_code=@COUNTRY@
ieee80211d=1

# 802.11n, with a short guard interval. The Pi's radio does not do much better than
# this and pretending otherwise just makes association slower.
ieee80211n=1
wmm_enabled=1
ht_capab=[HT40][SHORT-GI-20][DSSS_CCK-40]

# WPA2-PSK. Not WPA3: too many phones in an Indian college-fest crowd are old enough
# that WPA3-only means they cannot join, and a scanner that cannot join is a closed
# gate. WPA2 with a strong pre-shared key is the compromise, and the traffic on top
# of it is TLS anyway — the Wi-Fi key protects against a bystander joining the
# network, not against somebody reading a scan.
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_pairwise=CCMP

# The passphrase is not in this file. install.sh writes it to
# /etc/hostapd/wpa_psk (0600, root) and hostapd reads it from there, so this file can
# live in a git repository without being a credential.
wpa_psk_file=/etc/hostapd/wpa_psk

# Isolate the clients from each other.
#
# A scanner has no business talking to another scanner, and an attendee phone has no
# business talking to either. Everything goes through the box, so isolation costs
# nothing and removes a whole class of "somebody on the venue Wi-Fi poked at a gate
# phone" from the threat model.
ap_isolate=1

# Do not hide the network. A hidden SSID is not a security measure — it is a support
# call at 20:00 from somebody holding a scanner in a field.
ignore_broadcast_ssid=0

# Twelve scanners, a few staff phones, and headroom. The Pi's radio starts dropping
# frames well before a hundred associated clients, so the limit is set where the
# hardware actually is rather than where the protocol allows.
max_num_sta=32

# Beacon every 100ms, the default, and worth stating: raising it saves power and
# makes a scanner take longer to find the network after a reboot, which is time
# somebody spends standing at a gate.
beacon_int=100
